name: ui_kit_showcase
description: "UI Kit showcase example demonstrating all available components"
publish_to: 'none'
resolution: workspace
version: 1.0.0+1

environment:
  sdk: '>=3.9.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Workspace Dependencies - excluding core/shared to avoid flutter_secure_storage Linux issues
  ui_kit:
    path: ../../packages/ui_kit

flutter:
  uses-material-design: true
