name: basic_app_example
description: "Basic Flutter app example showcasing Neo-Tidaro workspace integration"
publish_to: 'none'
resolution: workspace
version: 1.0.0+1

environment:
  sdk: '3.9.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Workspace Dependencies - excluding core to avoid flutter_secure_storage Linux issues
  ui_kit:
    path: ../../packages/ui_kit

flutter:
  uses-material-design: true
dev_dependencies:
  flutter_test:
    sdk: flutter