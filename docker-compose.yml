version: "3.9"

# Neo-Tidaro uses Supabase for the backend. For local development, use the Supabase CLI,
# which runs the full stack (Postgres, Auth, Realtime, PostgREST, Storage, Studio, Kong)
# with correct wiring and ports as defined by supabase/config.toml.
#
# Quick start:
#   1) Install Supabase CLI: https://supabase.com/docs/guides/cli
#   2) From the repo root:
#        supabase start
#        supabase status   # shows ports like API:54321, DB:54322, Studio:54323
#        supabase db reset # resets DB and applies migrations from supabase/migrations
#        supabase stop
#   3) Seed data manually if needed:
#        supabase db reset --seed supabase/seeds/01_initial_tidash_data.sql
#
# Notes:
# - This compose file is intentionally a no-op to prevent drift from Supabase's official
#   local stack. Do not add a standalone Postgres here as it may conflict with ports/structure.
# - If you need pgAdmin temporarily, prefer connecting it to the Supabase Postgres port (54322)
#   launched by `supabase start`, but do not commit such overrides to version control.

services: {}
