name: tidash
resolution: workspace
description: "TiDaro A Tidy Dashboard for Admins."
publish_to: 'none'
version: 0.1.0-pre-alpha.1+1
environment:
  sdk: '3.9.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  languist:
    path: ../../packages/languist
  ui_kit:
    path: ../../packages/ui_kit
  shared:
    path: ../../packages/shared
  # Supabase
  supabase_flutter: ^2.5.6
  # UI & Animation
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
