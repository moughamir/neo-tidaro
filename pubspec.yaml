name: neo_tidaro
description: Neo Tidaro Workspace
version: 0.1.0-pre-alpha.4
publish_to: http://localhost:4000
homepage: https://github.com/odinn-s/neo-tidaro
repository: https://github.com/odinn-s/neo-tidaro
environment:
  sdk: "3.9.0"

workspace:
  # Core Packages
  - packages/ui_kit # UI Kit for Widgets and Styles
  - packages/shared # Shared and Utils
  - packages/domain # Domain Layer
  - packages/core # Core Packages
  - packages/languist # Internationalization and localization
  - packages/device_sensors # Device Sensors and Permissions
  # Applications
  - apps/tidash # Admin Dashboard
  - apps/tidaro_mini # Mini TiDaro App for Quick retention
  - apps/tidaro # Full TiDaro App
  # Examples
  - example/basic_app # Basic integration example
  - example/auth_flow # Authentication flow example
  - example/ui_kit_showcase # UI Kit components showcase

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  clay_containers: ^0.3.4
  connectivity_plus: ^6.1.5
  equatable: ^2.0.7
  flutter_dotenv: ^6.0.0
  flutter_markdown: ^0.7.7+1

  flutter_secure_storage: ^9.2.4
  fpdart: ^1.1.1
  get_it: ^8.2.0
  google_fonts: ^6.3.1
  intl: ^0.20.2
  logging: ^1.3.0
  material_color_utilities: ^0.11.1
  moment_dart: ^5.2.4
  permission_handler: ^12.0.1
  # Redux State Management
  redux: ^5.0.0
  redux_thunk: ^0.4.0
  flutter_redux: ^0.10.0
  #
  sensors_plus: ^6.1.2
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.10.0
  uuid: ^4.5.1
  yaml: ^3.1.3
# Platform support configuration
flutter:
  uses-material-design: true

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

melos:
  scripts:
    analyze:
      run: melos exec -c 8  -- flutter analyze
      description: Run `flutter analyze` in all packages.

    fix:apply:
      run: melos exec -c 8 --depends-on build_runner -- dart fix --apply
      description: Run `dart fix --apply` in all packages.
    fix:dry:
      run: melos exec -c 8 --depends-on build_runner -- dart fix -n
      description: Run `dart fix` in all packages with a dry run.

    test:
      run: melos exec -c 8 -- flutter test
      description: Run `flutter test` in all packages.

    run:app:
      run: melos exec -c 8 "flutter run"
      description: Run the main application.

    pub:upgrade:
      run: melos exec -c 8 -- flutter pub upgrade
      description: Run `flutter pub upgrade` in all packages.

    generate:
      run: melos exec -c 8 --depends-on build_runner -- dart run build_runner build
      description: Run build_runner in all packages.

    gen:l10n:
      run: melos exec -c 8 --scope="languist" -- dart run bin/generate_l10n.dart
      description: Generate localization files for the languist package using configuration from languist.yaml.

    clean:
      run: melos exec -c 8  -- flutter clean && melos exec -c 8  -- flutter pub get --no-pub
      description: Clean build directories and get dependencies in all packages.

    # Platform-specific runners for main apps
    run:tidaro:android:
      run: melos exec -c 8 --scope="tidaro" -- flutter run -d android --no-pub
      description: Run Tidaro on Android.

    run:tidaro:linux:
      run: melos exec -c 8 --scope="tidaro" -- flutter run -d linux
      description: Run Tidaro on Linux desktop.

    run:tidaro:web:
      run: melos exec -c 8 --scope="tidaro" -- flutter run -d web-server --web-port=8080
      description: Run Tidaro on web browser.

    run:tidaro:windows:
      run: melos exec -c 8 --scope="tidaro" -- flutter run -d windows
      description: Run Tidaro on Windows desktop.

    run:tidaro_mini:android:
      run: melos exec -c 8 --scope="tidaro_mini" -- flutter run -d android
      description: Run Tidaro Mini on Android.

    run:tidaro_mini:linux:
      run: melos exec -c 8 --scope="tidaro_mini" -- flutter run -d linux
      description: Run Tidaro Mini on Linux desktop.

    run:tidaro_mini:web:
      run: melos exec -c 8 --scope="tidaro_mini" -- flutter run -d web-server --web-port=8081
      description: Run Tidaro Mini on web browser.

    run:tidaro_mini:windows:
      run: melos exec -c 8 --scope="tidaro_mini" -- flutter run -d windows
      description: Run Tidaro Mini on Windows desktop.

    run:tidash:android:
      run: melos exec -c 8 --scope="tidash" -- flutter run -d android
      description: Run Tidash admin dashboard on Android.

    run:tidash:linux:
      run: melos exec -c 8 --scope="tidash" -- flutter run -d linux
      description: Run Tidash admin dashboard on Linux desktop.

    run:tidash:web:
      run: melos exec -c 8 --scope="tidash" -- flutter run -d web-server --web-port=8082
      description: Run Tidash admin dashboard on web browser.

    run:tidash:windows:
      run: melos exec -c 8 --scope="tidash" -- flutter run -d windows
      description: Run Tidash admin dashboard on Windows desktop.

    # Example runners - Linux only for development
    run:basic_app:
      run: melos exec -c 8 --scope="basic_app_example" -- flutter run -d linux
      description: Run the basic app example on Linux desktop.

    run:auth_flow:
      run: melos exec -c 8 --scope="auth_flow_example" -- flutter run -d linux
      description: Run the authentication flow example on Linux desktop.

    run:ui_kit_showcase:
      run: melos exec -c 8 --scope="ui_kit_showcase" -- flutter run -d linux
      description: Run the UI Kit showcase example on Linux desktop.

    # Build commands for all platforms
    build:android:
      run: melos exec -c 8 --scope="tidaro*" -- flutter build apk --release
      description: Build Android APK for all Tidaro apps.

    build:web:
      run: melos exec -c 8 --scope="tidaro*" -- flutter build web --release
      description: Build web app for all Tidaro apps.

    build:linux:
      run: melos exec -c 8 --scope="tidaro*" -- flutter build linux --release
      description: Build Linux desktop app for all Tidaro apps.

    build:windows:
      run: melos exec -c 8 --scope="tidaro*" -- flutter build windows --release
      description: Build Windows desktop app for all Tidaro apps.

dev_dependencies:
  melos: ^7.1.0
