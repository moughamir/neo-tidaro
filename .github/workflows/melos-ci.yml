name: Melos CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Dart pub cache path
        if: runner.os != 'Windows'
        run: echo "export PATH=\"$PATH:$HOME/.pub-cache/bin\"" >> $GITHUB_ENV

      - name: Setup Dart pub cache path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "PATH=$env:PATH;$env:USERPROFILE\AppData\Local\Pub\Cache\bin" >> $env:GITHUB_ENV

      - name: Install melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Analyze
        run: melos analyze

      - name: Test
        run: melos test || true  # Allow no tests to pass pipeline
